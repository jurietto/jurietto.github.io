<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffb5c0" />
    <title>jurietto.github.io/guestbook</title>
    <style>
      @font-face { font-family:"Comic Neue Local"; src:url("assets/font/ComicNeue-Light.ttf") format("truetype"); font-weight:300; font-style:normal; }
      @font-face { font-family:"Comic Neue Local"; src:url("assets/font/ComicNeue-Regular.ttf") format("truetype"); font-weight:400; font-style:normal; }
      @font-face { font-family:"Comic Neue Local"; src:url("assets/font/ComicNeue-Bold.ttf") format("truetype"); font-weight:700; font-style:normal; }
      * { box-sizing:border-box; }
      :root { --border-color:#3b164f; --border-width:3px; }
      body { margin:0; min-width:320px; color:#161116; background-color:#ffb5c0; font-family:"Comic Neue Local",sans-serif; font-size:16px; }
      .center-body { width:min(900px,calc(100% - 20px)); min-width:0; margin:0 auto; overflow:hidden; background:transparent; text-align:center; }
      .rating { margin:0 0 10px; color:#f0448d; }
      .site-title { margin:0 0 8px; font-weight:700; }
      .site-header { border:var(--border-width) solid var(--border-color); margin:0 16px; padding:12px 0 0; }
      .three-column { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)) 180px; gap:18px; padding:16px; align-items:stretch; }
      .page-column { min-width:0; border:var(--border-width) solid var(--border-color); padding:12px; }
      .sidebar-right { min-width:0; grid-column:3; grid-row:1 / span 2; }
      .page-column-center { grid-column:1 / -1; }
      .sidebar-image { display:block; max-width:100%; height:auto; margin:0 auto; }
      .sidebar-title { margin:16px 0 4px; font-weight:700; }
      .site-nav { display:grid; gap:8px; margin:0; text-align:center; }
      .site-nav form { display:block; margin:0; padding:10px; border:var(--border-width) solid var(--border-color); }
      .site-nav button { width:100%; border:0; background:transparent; color:inherit; font:inherit; text-transform:none; }
      .page-title { grid-column:1 / 3; margin:0 0 16px; font-weight:700; text-align:center; }
      .guestbook-panel { min-width:0; border:var(--border-width) solid var(--border-color); padding:12px; }
      .guestbook-panel-title { margin:0 0 12px; font-weight:700; }
      .guestbook-form { display:grid; gap:10px; text-align:left; }
      .guestbook-form label { display:grid; gap:4px; }
      .guestbook-form input, .guestbook-form textarea { width:100%; border:var(--border-width) solid var(--border-color); background:#fff; color:inherit; font:inherit; padding:8px; }
      .guestbook-form textarea { min-height:110px; resize:vertical; }
      .guestbook-form button { border:var(--border-width) solid var(--border-color); background:transparent; color:inherit; font:inherit; padding:8px 12px; cursor:pointer; }
      #guestbook-status { min-height:1.3em; margin:0; }
      #guestbook-entries { list-style:none; margin:0; padding:0; text-align:left; }
      .guestbook-entry { border:var(--border-width) solid var(--border-color); padding:12px; margin:0 0 12px; }
      .guestbook-entry strong, .guestbook-entry time { display:block; }
      .guestbook-entry time { margin-top:2px; }
      .guestbook-entry p { margin:8px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
      .landing-footer { margin:0 16px 16px; padding:12px 8px; border:var(--border-width) solid var(--border-color); line-height:1.35; }
      @media (max-width:620px) { .center-body{width:100%;min-height:100vh}.site-header{margin:0 8px}.three-column{display:block;padding:8px}.page-column{width:100%;margin-bottom:12px}.page-title{width:100%}.guestbook-panel{margin-bottom:12px}.sidebar-right{width:100%;margin-bottom:12px}.landing-footer{margin:0 8px 8px} }
    </style>
  </head>
  <body data-api-base="https://jurietto-guestbook-api.onrender.com">
    <main class="center-body">
      <header class="site-header">
        <p class="rating">♥ Rated MA - take care of yourself ♥</p>
        <h1 class="site-title">jurietto.github.io/guestbook</h1>
      </header>
      <div class="three-column">
        <h2 class="page-title">Guestbook</h2>
        <section class="guestbook-panel" aria-labelledby="sign-title">
          <h3 class="guestbook-panel-title" id="sign-title">Sign Guestbook</h3>
          <form class="guestbook-form" id="guestbook-form">
            <label>Name <input name="name" maxlength="80" required /></label>
            <label>Message <textarea name="message" maxlength="2000" required></textarea></label>
            <button type="submit">Sign guestbook</button>
            <p id="guestbook-status" role="status" aria-live="polite"></p>
          </form>
        </section>
        <section class="guestbook-panel" aria-labelledby="comments-title">
          <h3 class="guestbook-panel-title" id="comments-title">Comments</h3>
          <ul id="guestbook-entries" aria-live="polite"></ul>
        </section>
        <aside class="sidebar-right">
          <nav class="site-nav" aria-label="Main navigation">
            <form action="index.html"><button type="submit">Home</button></form>
            <form action="diary.html"><button type="submit">Diary</button></form>
            <form action="etc.html"><button type="submit">Etc</button></form>
            <form action="guestbook.html"><button type="submit">Guestbook</button></form>
            <form action="https://x.com/hexangel_93"><button type="submit">Twitter</button></form>
            <form action="https://www.youtube.com/@juriscafe"><button type="submit">YouTube</button></form>
          </nav>
        </aside>
      </div>
      <footer class="landing-footer">Site created 2026<br />Please seek professional support when you need it.<br />Last updated <time id="last-updated"></time></footer>
    </main>
    <script>
      const apiBase = document.body.dataset.apiBase;
      const form = document.getElementById("guestbook-form");
      const status = document.getElementById("guestbook-status");
      const entries = document.getElementById("guestbook-entries");

      function showStatus(message) {
        status.textContent = message;
      }

      function renderEntries(items) {
        entries.replaceChildren();

        if (!items.length) {
          const empty = document.createElement("li");
          empty.textContent = "No entries yet.";
          entries.append(empty);
          return;
        }

        items.forEach((item) => {
          const entry = document.createElement("li");
          const name = document.createElement("strong");
          const date = document.createElement("time");
          const message = document.createElement("p");

          name.textContent = item.name;
          date.textContent = new Date(item.createdAt).toLocaleString();
          message.textContent = item.message;
          entry.className = "guestbook-entry";
          entry.append(name, date, message);
          entries.append(entry);
        });
      }

      async function loadEntries() {
        try {
          const response = await fetch(`${apiBase}/api/guestbook`);
          if (!response.ok) throw new Error();
          renderEntries(await response.json());
        } catch {
          showStatus("The guestbook is not connected yet.");
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showStatus("Sending...");
        const formData = new FormData(form);

        try {
          const response = await fetch(`${apiBase}/api/guestbook`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: formData.get("name"),
              message: formData.get("message")
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Unable to sign the guestbook.");
          form.reset();
          showStatus("Entry added.");
          loadEntries();
        } catch (error) {
          showStatus(error.message || "The guestbook is not connected yet.");
        }
      });

      loadEntries();

      const lastUpdated = new Date(document.lastModified);
      if (!Number.isNaN(lastUpdated.getTime())) {
        document.getElementById("last-updated").textContent = lastUpdated.toLocaleDateString(undefined, {
          year: "numeric",
          month: "long",
          day: "numeric"
        });
      }
    </script>
  </body>
</html>
